<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OB-X — Polyphonic Synthesizer</title>
<style>
/* ===========================================================================
   OB-X — front panel stylesheet
   ---------------------------------------------------------------------------
   Everything is drawn with gradients, shadows and system fonts. No images,
   no @import, no web fonts, no data URIs.

   Sizing model
   ------------
   A single root unit `--u` is derived from the viewport with clamp(). All
   instrument geometry is expressed as `calc(<n> * var(--u))`, where <n> is a
   "design pixel" measured off the reference photograph (the instrument is
   1800 design px wide). At >=1820px viewport --u pins to 1px and the panel
   centres; at <=~910px it pins to 0.5px and the page scrolls horizontally
   rather than reflowing the instrument into something unrecognisable.

   Sections
   --------
   01  Reset, page chrome, theming
   02  Root metrics and palette
   03  Instrument shell — cheeks, chassis, brand strip
   04  Control surface grid (grid-template-areas)
   05  Sub-panels — face, bevel, panel names
   06  Rows, columns and captions
   07  Knob widget
   08  Rocker switch widget + LEDs
   09  Panel-specific layout
   10  Programmer LCD
   11  Performance panel
   12  Keybed
   13  Boot overlay, tooltip, accessibility
   =========================================================================== */


/* ===========================================================================
   01  Reset, page chrome, theming
   =========================================================================== */

*, *::before, *::after { box-sizing: border-box; }

[hidden] { display: none !important; }

:root {
  /* Page backdrop only — the instrument itself never changes appearance. */
  --page-bg-a: #e4e6ea;
  --page-bg-b: #c6cad2;
  --page-fg: #1b1e24;
  --page-vignette: rgba(0, 0, 0, .18);
}

@media (prefers-color-scheme: dark) {
  :root {
    --page-bg-a: #14161a;
    --page-bg-b: #06070a;
    --page-fg: #e6e9ef;
    --page-vignette: rgba(0, 0, 0, .55);
  }
}

:root[data-theme="light"] {
  --page-bg-a: #e4e6ea;
  --page-bg-b: #c6cad2;
  --page-fg: #1b1e24;
  --page-vignette: rgba(0, 0, 0, .18);
}

:root[data-theme="dark"] {
  --page-bg-a: #14161a;
  --page-bg-b: #06070a;
  --page-fg: #e6e9ef;
  --page-vignette: rgba(0, 0, 0, .55);
}

html { height: 100%; }

body {
  margin: 0;
  min-height: 100%;
  padding: calc(24 * var(--u)) 0;
  color: var(--page-fg);
  background:
    radial-gradient(120% 90% at 50% 0%, transparent 40%, var(--page-vignette) 100%),
    linear-gradient(178deg, var(--page-bg-a), var(--page-bg-b));
  background-attachment: fixed;
  font-family: var(--face);
  overflow-x: auto;
  -webkit-text-size-adjust: 100%;
}

/* Global drag affordance — set by the knob widget while a pointer drag runs. */
body.dragging,
body.dragging * {
  cursor: ns-resize !important;
  user-select: none;
  -webkit-user-select: none;
}


/* ===========================================================================
   02  Root metrics and palette
   =========================================================================== */

:root {
  /* 1800 design px wide instrument; 0.05494vw ~= 100vw / 1820 (scrollbar slack) */
  --u: clamp(0.5px, 0.05494vw, 1px);

  /* Type stacks — system only. */
  --face: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", system-ui, sans-serif;
  --face-brand: Georgia, "Times New Roman", "Liberation Serif", serif;
  --face-lcd: "DejaVu Sans", "Segoe UI", Tahoma, Verdana, sans-serif;

  /* Cabinet */
  --wood-1: #8a5a31;
  --wood-2: #6b4224;
  --wood-3: #4e2f18;
  --black-1: #26262a;
  --black-2: #17171a;
  --black-3: #101012;

  /* Sub-panel face (cool light blue-grey brushed metal) */
  --face-hi: #d2d9e3;
  --face-mid: #c2cbd9;
  --face-lo: #b4becf;
  --face-ink: #191d24;

  /* Knobs / caps */
  --cap-bg: #0d0e10;
  --cap-ink: #f1f2f4;

  /* Panel geometry */
  --gutter: calc(13 * var(--u));
  --panel-pad-x: calc(11 * var(--u));
  --panel-pad-t: calc(13 * var(--u));
}


/* ===========================================================================
   03  Instrument shell — cheeks, chassis, brand strip
   =========================================================================== */

.obx {
  display: grid;
  grid-template-columns: calc(40 * var(--u)) minmax(0, 1fr) calc(40 * var(--u));
  width: calc(1800 * var(--u));
  min-width: calc(1800 * var(--u));
  margin: 0 auto;
  border-radius: calc(6 * var(--u));
  filter: drop-shadow(0 calc(14 * var(--u)) calc(26 * var(--u)) rgba(0, 0, 0, .45));
}

/* --- wood end cheeks ----------------------------------------------------- */
.cheek {
  border-radius: calc(5 * var(--u));
  background:
    repeating-linear-gradient(91deg,
      rgba(0, 0, 0, .20) 0 1px,
      rgba(255, 255, 255, .045) 1px 3px,
      rgba(0, 0, 0, .10) 3px 6px,
      rgba(255, 255, 255, .02) 6px 11px),
    repeating-linear-gradient(87deg,
      rgba(0, 0, 0, .10) 0 5px,
      transparent 5px 17px),
    linear-gradient(102deg, var(--wood-2) 0%, var(--wood-1) 26%, var(--wood-3) 62%, #7d4e2a 100%);
  box-shadow:
    inset 0 calc(2 * var(--u)) 0 rgba(255, 255, 255, .16),
    inset 0 calc(-3 * var(--u)) calc(6 * var(--u)) rgba(0, 0, 0, .5),
    inset calc(-2 * var(--u)) 0 calc(4 * var(--u)) rgba(0, 0, 0, .35);
}

.cheek-left  { box-shadow: inset 0 calc(2 * var(--u)) 0 rgba(255,255,255,.16), inset calc(-3 * var(--u)) 0 calc(7 * var(--u)) rgba(0,0,0,.45); }
.cheek-right { box-shadow: inset 0 calc(2 * var(--u)) 0 rgba(255,255,255,.16), inset calc(3 * var(--u)) 0 calc(7 * var(--u)) rgba(0,0,0,.45); }

/* --- matte black textured chassis ---------------------------------------- */
.chassis {
  position: relative;
  padding: calc(26 * var(--u)) calc(24 * var(--u)) calc(20 * var(--u));
  background:
    repeating-linear-gradient(45deg,
      rgba(255, 255, 255, .016) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(-45deg,
      rgba(0, 0, 0, .28) 0 1px, transparent 1px 3px),
    radial-gradient(140% 100% at 50% -10%, rgba(255, 255, 255, .07), transparent 60%),
    linear-gradient(180deg, var(--black-1) 0%, var(--black-2) 38%, var(--black-3) 100%);
  box-shadow:
    inset 0 calc(1 * var(--u)) 0 rgba(255, 255, 255, .10),
    inset 0 calc(-2 * var(--u)) calc(5 * var(--u)) rgba(0, 0, 0, .7);
}

/* --- brand strip --------------------------------------------------------- */
.brand-strip {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: calc(10 * var(--u));
  height: calc(58 * var(--u));
  padding: 0 calc(18 * var(--u)) 0 0;
}

.brand-mark {
  display: block;
  width: calc(56 * var(--u));
  height: calc(34 * var(--u));
}

.brand-glyph {
  display: block;
  width: 100%;
  height: 100%;
  fill: none;
  stroke: #f4f5f7;
  stroke-width: 3.2;
  stroke-linecap: round;
  filter: drop-shadow(0 calc(1 * var(--u)) calc(2 * var(--u)) rgba(0, 0, 0, .8));
}

.brand-name {
  font-family: var(--face-brand);
  font-weight: 700;
  font-size: calc(40 * var(--u));
  line-height: 1;
  letter-spacing: calc(0.4 * var(--u));
  color: #fafbfc;
  text-shadow:
    0 calc(1 * var(--u)) 0 rgba(0, 0, 0, .8),
    0 calc(3 * var(--u)) calc(7 * var(--u)) rgba(0, 0, 0, .6);
}


/* ===========================================================================
   04  Control surface grid
   ---------------------------------------------------------------------------
   MASTER, CONTROL and MODULATION are full-height columns (they span both
   rows, exactly as on the real instrument); OSCILLATORS, FILTER and
   ENVELOPES sit on the top row with KEYBOARD and PROGRAMMER beneath them.
   Column 5 exists purely so PROGRAMMER can start part-way under
   OSCILLATORS, matching the photograph.
   =========================================================================== */

.control-surface {
  position: relative;
  display: grid;
  /* MASTER/CONTROL only ever hold two knobs abreast, so they give width back
     to MODULATION, which needs three equal columns wide enough for the
     "DESTINATION" captions. Column 5 is a sliver that lets PROGRAMMER start
     part-way under OSCILLATORS, as in the photograph. */
  grid-template-columns: 100fr 100fr 200fr 125fr 65fr 195fr 226fr;
  /* Row proportions follow the photograph (top row ~1.7x the lower row); the
     minmax() lower bounds hold the ratio while letting content grow. */
  grid-template-rows:
    minmax(calc(196 * var(--u)), auto)
    minmax(calc(124 * var(--u)), auto);
  grid-template-areas:
    "master control modulation oscillators oscillators filter     envelopes"
    "master control modulation keyboard    programmer  programmer programmer";
  gap: var(--gutter);
}

.panel-master      { grid-area: master; }
.panel-control     { grid-area: control; }
.panel-modulation  { grid-area: modulation; }
.panel-oscillators { grid-area: oscillators; }
.panel-filter      { grid-area: filter; }
.panel-envelopes   { grid-area: envelopes; }
.panel-keyboard    { grid-area: keyboard; }
.panel-programmer  { grid-area: programmer; }


/* ===========================================================================
   05  Sub-panels — brushed light blue-grey faces
   =========================================================================== */

.panel {
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
  border: 1px solid #23262c;
  border-radius: calc(3 * var(--u));
  background:
    /* fine vertical brushing */
    repeating-linear-gradient(90deg,
      rgba(255, 255, 255, .050) 0 1px,
      rgba(0, 0, 0, .030) 1px 2px,
      transparent 2px 4px),
    /* broad sheen */
    linear-gradient(163deg,
      var(--face-hi) 0%,
      var(--face-mid) 34%,
      var(--face-lo) 63%,
      #c7cfdb 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .65),
    inset 0 -1px 0 rgba(0, 0, 0, .30),
    inset 1px 0 0 rgba(255, 255, 255, .30),
    inset -1px 0 0 rgba(0, 0, 0, .20),
    0 calc(2 * var(--u)) calc(6 * var(--u)) rgba(0, 0, 0, .55);
}

.panel-inner {
  flex: 1 1 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(10 * var(--u));
  padding: var(--panel-pad-t) var(--panel-pad-x) calc(4 * var(--u));
  min-width: 0;
}

.panel-name {
  flex: 0 0 auto;
  padding: calc(3 * var(--u)) 0 calc(8 * var(--u));
  text-align: center;
  font-size: calc(16 * var(--u));
  font-weight: 400;
  font-stretch: condensed;
  letter-spacing: calc(2.4 * var(--u));
  color: #fdfdfe;
  text-shadow:
    0 1px 0 rgba(0, 0, 0, .55),
    0 calc(2 * var(--u)) calc(4 * var(--u)) rgba(0, 0, 0, .40);
}


/* ===========================================================================
   06  Rows, columns and captions
   =========================================================================== */

.row {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: calc(10 * var(--u));
}

.col {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(9 * var(--u));
}

.row.knobs {
  width: 100%;
  justify-content: space-around;
  gap: calc(4 * var(--u));
}

.row.knobs.single { justify-content: center; }

.row.switches {
  gap: calc(8 * var(--u));
  align-items: flex-end;
}

.row.pair {
  gap: calc(7 * var(--u));
  align-items: flex-end;
}

.row.progs { gap: calc(9 * var(--u)); }

.ctl { flex: 0 0 auto; }

/* Small dark captions printed straight onto the panel face. */
.col-cap,
.group-cap,
.group-sub,
.osc-num {
  font-size: calc(11 * var(--u));
  font-stretch: condensed;
  letter-spacing: calc(0.9 * var(--u));
  color: #1e232b;
  text-transform: uppercase;
  white-space: nowrap;
  text-shadow: 0 1px 0 rgba(255, 255, 255, .45);
}

.col-cap {
  font-size: calc(12 * var(--u));
  letter-spacing: calc(0.8 * var(--u));
}

.group-cap { font-size: calc(9.5 * var(--u)); }

.osc-num {
  font-size: calc(15 * var(--u));
  letter-spacing: 0;
  line-height: 1;
}

/* "— TRIANGLE —" style sub-caption with rules either side. */
.group-sub {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: calc(5 * var(--u));
  width: 100%;
  font-size: calc(9 * var(--u));
}

.group-sub::before,
.group-sub::after {
  content: "";
  flex: 1 1 auto;
  min-width: calc(8 * var(--u));
  height: 1px;
  background: rgba(24, 30, 40, .55);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .4);
}

.sw-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(4 * var(--u));
}

/* Envelope panel titles (this panel carries no .panel-name). */
.env-title {
  font-size: calc(15 * var(--u));
  font-stretch: condensed;
  letter-spacing: calc(2 * var(--u));
  color: #fdfdfe;
  text-transform: uppercase;
  text-shadow: 0 1px 0 rgba(0, 0, 0, .5), 0 calc(2 * var(--u)) calc(4 * var(--u)) rgba(0, 0, 0, .35);
}

.env-title.top { margin-bottom: calc(-3 * var(--u)); }
.env-title.bottom { margin-top: calc(-3 * var(--u)); }


/* ===========================================================================
   07  Knob widget
   ---------------------------------------------------------------------------
   .knob-ctl > [.led] + .cap + .knob > (.knob-ticks > i.tick) + .knob-body >
   .knob-pointer

   Ticks: JS writes an inline `transform: rotate(Ndeg) translateY(-50%)`, so
   the ring radius has to come from transform-origin. With the tick centred on
   the knob (left/top 50%), margin-top:-R and transform-origin:50% R, the
   composite maps each tick onto a circle of radius R about the knob centre.
   =========================================================================== */

.knob-ctl {
  /* unitless design-pixel metrics, multiplied by --u below */
  --kb: 42;    /* knob body diameter   */
  --kr: 28;    /* tick ring radius     */
  --kbox: 62;  /* widget box           */
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(3 * var(--u));
  width: calc(var(--kbox) * var(--u));
}

.knob-ctl.size-sm { --kb: 34; --kr: 23; --kbox: 52; }
.knob-ctl.size-xs { --kb: 26; --kr: 18; --kbox: 40; }

/* --- black label plate --------------------------------------------------- */
.cap {
  padding: calc(2 * var(--u)) calc(5 * var(--u));
  border-radius: calc(1.5 * var(--u));
  background: linear-gradient(180deg, #26282c 0%, var(--cap-bg) 45%, #060607 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .18),
    0 1px 0 rgba(255, 255, 255, .45),
    0 calc(1 * var(--u)) calc(2 * var(--u)) rgba(0, 0, 0, .45);
  color: var(--cap-ink);
  font-size: calc(8 * var(--u));
  font-stretch: condensed;
  letter-spacing: calc(0.5 * var(--u));
  line-height: 1.35;
  text-transform: uppercase;
  white-space: nowrap;
}

.cap.tiny {
  font-size: calc(7 * var(--u));
  padding: calc(1.5 * var(--u)) calc(4 * var(--u));
}

.knob-led { margin-bottom: calc(1 * var(--u)); }

/* --- knob proper --------------------------------------------------------- */
.knob {
  position: relative;
  width: calc(var(--kbox) * var(--u));
  height: calc(var(--kbox) * var(--u));
  border-radius: 50%;
  cursor: ns-resize;
  touch-action: none;
}

.knob-ticks {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.knob-ticks .tick {
  position: absolute;
  left: 50%;
  top: 50%;
  width: calc(1.8 * var(--u));
  height: calc(5 * var(--u));
  margin-left: calc(-0.9 * var(--u));
  margin-top: calc(var(--kr) * var(--u) * -1);
  transform-origin: 50% calc(var(--kr) * var(--u));
  border-radius: calc(1 * var(--u));
  background: rgba(22, 26, 33, .78);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .40);
}

.knob-body {
  position: absolute;
  left: 50%;
  top: 50%;
  width: calc(var(--kb) * var(--u));
  height: calc(var(--kb) * var(--u));
  margin-left: calc(var(--kb) * var(--u) / -2);
  margin-top: calc(var(--kb) * var(--u) / -2);
  border-radius: 50%;
  background:
    /* top-left specular highlight */
    radial-gradient(circle at 33% 24%,
      rgba(255, 255, 255, .34) 0%,
      rgba(255, 255, 255, .10) 26%,
      rgba(255, 255, 255, 0) 54%),
    /* fluted skirt */
    repeating-conic-gradient(from 0deg,
      rgba(255, 255, 255, .055) 0deg 3.6deg,
      rgba(0, 0, 0, .16) 3.6deg 7.2deg),
    /* moulded body */
    radial-gradient(circle at 50% 42%, #4b4744 0%, #322e2b 46%, #201d1b 72%, #0e0d0d 100%);
  box-shadow:
    inset 0 calc(1.5 * var(--u)) calc(2 * var(--u)) rgba(255, 255, 255, .14),
    inset 0 calc(-3 * var(--u)) calc(5 * var(--u)) rgba(0, 0, 0, .65),
    inset 0 0 0 1px rgba(0, 0, 0, .55),
    0 calc(2 * var(--u)) calc(5 * var(--u)) rgba(0, 0, 0, .55);
}

/* JS rotates this element; it is the full body box so the default
   50%/50% transform-origin is the knob centre. */
.knob-pointer {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  will-change: transform;
}

.knob-pointer::before {
  content: "";
  position: absolute;
  left: 50%;
  top: calc(var(--kb) * var(--u) * 0.055);
  width: 0;
  height: 0;
  transform: translateX(-50%);
  border-left: calc(var(--kb) * var(--u) * 0.105) solid transparent;
  border-right: calc(var(--kb) * var(--u) * 0.105) solid transparent;
  border-bottom: calc(var(--kb) * var(--u) * 0.185) solid #f5f4f0;
  filter: drop-shadow(0 1px calc(1 * var(--u)) rgba(0, 0, 0, .75));
}


/* ===========================================================================
   08  Rocker switch widget + LEDs
   =========================================================================== */

.sw-ctl {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: calc(2 * var(--u));
  width: calc(34 * var(--u));
}

.sw-ctl.wide { width: calc(46 * var(--u)); }

/* Tiny FIL / AMP style captions on their own line above the cap. One equal
   grid track per caption, spilling a little either side of the cap so each
   caption centres over its own LED and neighbours never run together
   ("HALF FULL", not "HALFFULL"). */
.led-caps {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  width: calc(100% + 6 * var(--u));
  margin: 0 calc(-3 * var(--u)) calc(1 * var(--u));
  font-size: calc(6.5 * var(--u));
  font-stretch: condensed;
  letter-spacing: calc(0.2 * var(--u));
  line-height: 1.2;
  color: #1d222a;
  text-transform: uppercase;
  text-shadow: 0 1px 0 rgba(255, 255, 255, .45);
  white-space: nowrap;
}

.led-cap {
  display: block;
  text-align: center;
  overflow: visible;
}

button.rocker {
  position: relative;
  display: block;
  width: 100%;
  height: calc(44 * var(--u));
  margin: 0;
  padding: 0;
  border: 0;
  border-radius: calc(2.5 * var(--u));
  cursor: pointer;
  overflow: visible;
  font: inherit;
  color: inherit;
  background:
    linear-gradient(180deg,
      #35353a 0%,
      #1d1d21 10%,
      #131316 46%,
      #0c0c0e 52%,
      #17171a 100%);
  box-shadow:
    inset 0 1px 0 rgba(255, 255, 255, .22),
    inset 0 calc(-2 * var(--u)) calc(4 * var(--u)) rgba(0, 0, 0, .75),
    inset calc(1 * var(--u)) 0 calc(2 * var(--u)) rgba(255, 255, 255, .05),
    0 calc(2 * var(--u)) calc(4 * var(--u)) rgba(0, 0, 0, .6);
}

button.rocker:active { transform: translateY(calc(0.5 * var(--u))); }

/* Centred on max-content rather than stretched edge-to-edge, so a long legend
   spills a hair onto the panel instead of being clipped by the cap. */
.sw-label {
  position: absolute;
  left: 50%;
  right: auto;
  top: calc(3 * var(--u));
  width: max-content;
  transform: translateX(-50%);
  font-size: calc(7.5 * var(--u));
  font-stretch: condensed;
  letter-spacing: calc(0.2 * var(--u));
  line-height: 1;
  color: #eceded;
  text-transform: uppercase;
  text-align: center;
  text-shadow: 0 1px 0 rgba(0, 0, 0, .9);
  pointer-events: none;
  white-space: nowrap;
}

.leds {
  position: absolute;
  left: 0;
  right: 0;
  top: calc(15 * var(--u));
  display: flex;
  align-items: center;
  justify-content: center;
  gap: calc(7 * var(--u));
  pointer-events: none;
}

.leds.n1 { gap: 0; }
/* Matches the two .led-cap track centres above, so caption sits over LED. */
.leds.n2 { gap: calc(14 * var(--u)); }

/* glossy lower face / seam across the bottom third of the cap */
.rocker-face {
  position: absolute;
  left: calc(3 * var(--u));
  right: calc(3 * var(--u));
  bottom: calc(3 * var(--u));
  height: calc(17 * var(--u));
  border-radius: calc(1.5 * var(--u));
  background: linear-gradient(180deg,
    rgba(255, 255, 255, .34) 0%,
    rgba(255, 255, 255, .09) 14%,
    rgba(255, 255, 255, .02) 40%,
    rgba(0, 0, 0, .38) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .40);
  pointer-events: none;
}

/* --- LEDs ---------------------------------------------------------------- */
.led {
  display: block;
  flex: 0 0 auto;
  width: calc(6 * var(--u));
  height: calc(6 * var(--u));
  border-radius: 50%;
  background: radial-gradient(circle at 36% 30%, #7c2320 0%, #45100e 62%, #250807 100%);
  box-shadow:
    inset 0 0 0 1px rgba(0, 0, 0, .70),
    inset 0 calc(-1 * var(--u)) calc(1 * var(--u)) rgba(0, 0, 0, .6);
}

.led-amber {

/*
 * OB-X replica — AudioWorklet DSP engine.
 *
 * Eight voices, each with two oscillators, a noise source, a resonant
 * low-pass filter and two ADSR envelopes, following the architecture set out
 * in the OB-X Owner's Manual:
 *
 *   OSC 1 (saw / pulse / triangle, 4-octave range)  ─┐
 *   OSC 2 (saw / pulse / triangle, 5-octave range)  ─┼─> FILTER ─> VCA ─> pan
 *   NOISE (half / full)                             ─┘     ^        ^
 *                                        FILTER ENVELOPE ──┘        │
 *                                                 LOUDNESS ENVELOPE ┘
 *
 * The LFO is per layer (the original has one LFO for the whole instrument),
 * with two destination groups: DEPTH 1 to oscillator/filter frequency and
 * DEPTH 2 to pulse width and volume.
 *
 * This file runs on the audio thread and therefore does not import anything;
 * the main thread pushes a complete parameter set over the message port.
 */

const SR = sampleRate;
const TWO_PI = Math.PI * 2;
const VOICE_COUNT = 8;
const ALL_VOICES = Array.from({ length: VOICE_COUNT }, (_, i) => i);

// ---------------------------------------------------------------------------
// Parameter scaling — the programmer stores 0..1; these turn that into
// musical units. Kept together so the mapping is auditable in one place.
// ---------------------------------------------------------------------------

const scale = {
  // "Its range is from approximately 1/10 oscillation per second to 20
  //  oscillations per second."
  lfoRate: (v) => 0.1 * Math.pow(200, v),
  // Envelope times: 1 ms to 10 s, cubic taper.
  time: (v) => 0.001 + 9.999 * v * v * v,
  // Filter cut-off, 16 Hz to ~18 kHz.
  cutoff: (v) => 16 * Math.pow(2, v * 10.1),
  // "in one octave increments over a four octave range"
  osc1Semis: (v) => Math.round(v * 4) * 12,
  // "in half-step increments over a five octave range"
  osc2Semis: (v) => Math.round(v * 60),
  // "fully counter-clockwise a square wave (50 % duty cycle) ... fully
  //  clockwise a 5 % duty cycle"
  pulseWidth: (v) => 0.5 - v * 0.45,
  // Polyphonic portamento, up to two seconds.
  glide: (v) => (v <= 0.001 ? 0 : 2.0 * v * v),
};

function semisToRatio(s) { return Math.pow(2, s / 12); }
function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

/*
 * Pade approximation of tanh, within about 1e-3 over the range the drive
 * stage uses. It runs twice per sample per voice inside the oversampled
 * oscillator loop, where the library call measured about a third of the
 * engine's total cost.
 */
function fastTanh(x) {
  if (x < -3) return -1;
  if (x > 3) return 1;
  const x2 = x * x;
  return x * (27 + x2) / (27 + 9 * x2);
}

/*
 * Output saturation. Eight voices in unison with both oscillators, noise and
 * full resonance can sum past full scale, and hard digital clipping there
 * sounds nothing like an overdriven analogue output stage. This is unity
 * below the knee and bends smoothly to the rail above it, so the instrument
 * can be driven hard without ever producing a squared-off edge.
 */
const KNEE = 0.7;
function softClip(x) {
  const a = Math.abs(x);
  if (a <= KNEE) return x;
  return Math.sign(x) * (KNEE + (1 - KNEE) * Math.tanh((a - KNEE) / (1 - KNEE)));
}

// ---------------------------------------------------------------------------
// Band-limited oscillator primitives
// ---------------------------------------------------------------------------

/** PolyBLEP residual for a step discontinuity at phase t with increment dt. */
function polyBlep(t, dt) {
  if (t < dt) { const x = t / dt; return x + x - x * x - 1; }
  if (t > 1 - dt) { const x = (t - 1) / dt; return x * x + x + x + 1; }
  return 0;
}

/*
 * Decimation from the 2x oversampled oscillator rate down to the host rate.
 *
 * Going to 4x was measured and reverted: it moved the alias figure by less
 * than a decibel while costing 43 % more CPU, because what remains is the
 * final stage's transition band folding 22-28 kHz down into the top octave,
 * which no amount of upstream oversampling changes.
 *
 * A 31-tap half-band Kaiser design: unity through the audio band, 47 dB down
 * by 0.35 of the internal rate and 88 dB by 0.40, so the oscillators' residual
 * content folds back well below audibility instead of landing in the
 * midrange. Half the taps are exactly zero, which is where the saving is —
 * only 17 multiply-accumulates per output sample.
 */
const DECIM_TAPS = new Float64Array([
  -0.000019404335, 0, 0.000387963060, 0, -0.001982976718, 0, 0.006562589271, 0,
  -0.017124136064, 0, 0.039222973633, 0, -0.089397568908, 0, 0.312354139263, 0.499992841596,
  0.312354139263, 0, -0.089397568908, 0, 0.039222973633, 0, -0.017124136064, 0,
  0.006562589271, 0, -0.001982976718, 0, 0.000387963060, 0, -0.000019404335,
]);
/** Indices of the non-zero taps, so the zeros cost nothing at run time. */
const DECIM_NZ = Uint8Array.from(DECIM_TAPS.reduce(
  (acc, c, i) => (c !== 0 ? (acc.push(i), acc) : acc), []));
const DECIM_LEN = 32; // power of two, so the ring index masks

class Decimator {
  constructor() { this.buf = new Float64Array(DECIM_LEN); this.pos = 0; }

  push(x) {
    this.buf[this.pos] = x;
    this.pos = (this.pos + 1) & (DECIM_LEN - 1);
  }

  /** Filtered value for the samples pushed so far. Call once per host sample. */
  read() {
    let acc = 0;
    const base = this.pos;
    for (let n = 0; n < DECIM_NZ.length; n++) {
      const i = DECIM_NZ[n];
      acc += DECIM_TAPS[i] * this.buf[(base + i) & (DECIM_LEN - 1)];
    }
    return acc;
  }

  reset() { this.buf.fill(0); this.pos = 0; }
}

/*
 * A narrow pulse carries a large DC component — at a 5 % duty cycle the offset
 * is most of the waveform's amplitude. Left in, the loudness envelope
 * multiplies it and every note starts and ends with a thump, sweeping the
 * pulse width wobbles the whole mix, and the offset eats headroom. Real
 * instruments are AC-coupled at the output; this is the equivalent, a one-pole
 * high-pass sitting below the lowest note.
 */
class DCBlocker {
  constructor() { this.x1 = 0; this.y1 = 0; }

  process(x) {
    const y = x - this.x1 + 0.9989 * this.y1;   // about 8 Hz at 44.1 kHz
    this.x1 = x;
    this.y1 = y;
    return y;
  }

  reset() { this.x1 = this.y1 = 0; }
}

// ---------------------------------------------------------------------------
// ADSR envelope — analogue-style exponential segments.
// ---------------------------------------------------------------------------

const IDLE = 0, ATTACK = 1, DECAY = 2, SUSTAIN = 3, RELEASE = 4;

class ADSR {
  constructor() { this.stage = IDLE; this.level = 0; }

  gateOn() { this.stage = ATTACK; }
  gateOff() { if (this.stage !== IDLE) this.stage = RELEASE; }
  kill() { this.stage = IDLE; this.level = 0; }
  get active() { return this.stage !== IDLE || this.level > 1e-5; }

  /** ca/cd/cr are per-sample one-pole coefficients, s is the sustain level. */
  process(ca, cd, cr, s) {
    switch (this.stage) {
      case ATTACK:
        // Aim past the top so the attack segment stays brisk and curved.
        this.level += (1.25 - this.level) * ca;
        if (this.level >= 1) { this.level = 1; this.stage = DECAY; }
        break;
      case DECAY:
        this.level += (s - this.level) * cd;
        if (Math.abs(this.level - s) < 1e-4) { this.level = s; this.stage = SUSTAIN; }
        break;
      case SUSTAIN:
        this.level += (s - this.level) * cd;
        break;
      case RELEASE:
        this.level -= this.level * cr;
        if (this.level < 1e-5) { this.level = 0; this.stage = IDLE; }
        break;
      default:
        this.level = 0;
    }
    return this.level;
  }
}

// ---------------------------------------------------------------------------
// Filter.
//
// The manual describes "a two-pole, low-pass type", which is the default here:
// one topology-preserving state-variable section, taken from the trapezoidal
// integration form, whose damping term gives a proper resonant peak. The
// panel's TYPE switch adds a 24 dB/octave option, built by cascading a second
// section behind the resonant one.
//
// The damping term never reaches zero, so the filter cannot ring on its own —
// the manual is explicit that "even in its maximum position, the Filter cannot
// be put into oscillation".
// ---------------------------------------------------------------------------

/** One TPT state-variable low-pass section. `k` is the damping, 1/Q. */
class SVF {
  constructor() { this.ic1 = 0; this.ic2 = 0; }

  process(x, g, k) {
    const a1 = 1 / (1 + g * (g + k));
    const a2 = g * a1;
    const v3 = x - this.ic2;
    const v1 = a1 * this.ic1 + a2 * v3;
    const v2 = this.ic2 + g * v1;
    this.ic1 = 2 * v1 - this.ic1;
    this.ic2 = 2 * v2 - this.ic2;
    return v2;
  }

  reset() { this.ic1 = this.ic2 = 0; }
}

class OBXFilter {
  constructor() { this.a = new SVF(); this.b = new SVF(); }

  /** k1 damps the resonant section; the second section only runs in 4-pole. */
  process(x, g, k1, fourPole) {
    let y = this.a.process(x, g, k1);
    if (fourPole) y = this.b.process(y, g, 1.35);
    return y;
  }

  reset() { this.a.reset(); this.b.reset(); }
}

// ---------------------------------------------------------------------------
// Voice
// ---------------------------------------------------------------------------

class Voice {
  constructor(index) {
    this.index = index;
    this.layer = 0;
    this.note = -1;
    this.gate = false;
    this.velocity = 1;
    this.pressure = 0;
    this.age = 0;

    this.phase1 = Math.random();
    this.phase2 = Math.random();
    this.tri1 = 0;
    this.tri2 = 0;
    this.pitch = 60;      // current (glided) pitch in MIDI note units
    this.target = 60;
    this.filterEnv = new ADSR();
    this.ampEnv = new ADSR();
    this.filter = new OBXFilter();
    this.decim = new Decimator();
    this.dcBlock = new DCBlocker();
    this.noiseState = (index * 2654435761) >>> 0;

    // Per-voice analogue scatter, re-rolled on every note-on. The VINTAGE
    // control scales all of it.
    this.driftA = 0; this.driftB = 0; this.cutoffTrim = 0; this.timeTrim = 1;
    this.driftPhaseA = Math.random() * TWO_PI;
    this.driftPhaseB = Math.random() * TWO_PI;
    this.reroll();
  }

  reroll() {
    this.driftA = (Math.random() * 2 - 1);
    this.driftB = (Math.random() * 2 - 1);
    this.cutoffTrim = (Math.random() * 2 - 1);
    this.timeTrim = 1 + (Math.random() * 2 - 1) * 0.12;
  }

  get active() { return this.ampEnv.active; }

  noteOn(note, vel, glideFrom) {
    this.note = note;
    this.target = note;
    if (glideFrom !== null && glideFrom !== undefined) this.pitch = glideFrom;
    else if (!this.active) this.pitch = note;
    this.velocity = vel;
    this.gate = true;
    this.reroll();
    if (!this.active) { this.filter.reset(); }
    this.filterEnv.gateOn();
    this.ampEnv.gateOn();
  }

  noteOff() {
    this.gate = false;
    this.filterEnv.gateOff();
    this.ampEnv.gateOff();
  }

  kill() {
    this.gate = false;
    this.note = -1;
    this.filterEnv.kill();
    this.ampEnv.kill();
    this.filter.reset();
    this.decim.reset();
    this.dcBlock.reset();
  }

  noise() {
    // xorshift32 — flat, cheap, and deterministic per voice.
    let x = this.noiseState;
    x ^= x << 13; x >>>= 0;
    x ^= x >> 17;
    x ^= x << 5; x >>>= 0;
    this.noiseState = x;
    return (x / 2147483648) - 1;
  }
}

// ---------------------------------------------------------------------------
// Layer — one program's worth of parameters plus its LFO.
// ---------------------------------------------------------------------------

class Layer {
  constructor() {
    this.p = Object.create(null);
    this.lfoPhase = Math.random();
    this.shValue = 0;
    this.shArmed = false;
    this.lfoBuf = new Float32Array(128);
    // Smoothed values so knob moves do not zipper.
    this.smCutoff = 0;
    this.smVolume = 1;
  }

  get(id, dflt = 0) {
    const v = this.p[id];
    return typeof v === 'number' ? v : dflt;
  }

  renderLFO(n, rateExtra) {
    if (this.lfoBuf.length < n) this.lfoBuf = new Float32Array(n);
    const buf = this.lfoBuf;
    const rate = scale.lfoRate(this.get('lfoRate', 0.35)) * rateExtra;
    const inc = rate / SR;
    const useSine = this.get('lfoSine') >= 0.5;
    const useSquare = this.get('lfoSquare') >= 0.5;
    const useSH = this.get('lfoSH') >= 0.5;
    const count = (useSine ? 1 : 0) + (useSquare ? 1 : 0) + (useSH ? 1 : 0);
    const norm = count > 1 ? 1 / count : 1;

    for (let i = 0; i < n; i++) {
      this.lfoPhase += inc;
      if (this.lfoPhase >= 1) {
        this.lfoPhase -= 1;
        // "selects a random output from the LFO" — one new value per cycle.
        this.shValue = Math.random() * 2 - 1;
      }
      let v = 0;
      if (useSine) v += Math.sin(TWO_PI * this.lfoPhase);
      if (useSquare) v += this.lfoPhase < 0.5 ? 1 : -1;
      if (useSH) v += this.shValue;
      buf[i] = count === 0 ? 0 : clamp(v * norm, -1, 1);
    }
    return buf;
  }
}

// ---------------------------------------------------------------------------
// Processor
// ---------------------------------------------------------------------------

class OBXProcessor extends AudioWorkletProcessor {
  constructor() {
    super();
    this.layers = [new Layer(), new Layer()];
    this.voices = Array.from({ length: VOICE_COUNT }, (_, i) => new Voice(i));
    this.pools = [[0, 1, 2, 3, 4, 5, 6, 7], []];
    this.globals = {
      masterVol: 0.75,
      volBalance: 0.5,
      masterTune: 0.5,
      bend: 0,
      bendRange: 0,
      bendOsc2Only: 0,
      modDepth: 0,
      transpose: 0,
      unisonSpread: 1,
      pressure: 0,
    };
    this.tuneDrift = 0;    // slowly accumulating oscillator drift
    this.driftClock = 0;
    this.masterGain = 0;
    this.port.onmessage = (e) => this.onMessage(e.data);
  }

  onMessage(m) {
    switch (m.type) {
      case 'patch': {
        const layer = this.layers[m.layer | 0];
        for (const [k, v] of Object.entries(m.params)) layer.p[k] = v;
        break;
      }
      case 'param':
        this.layers[m.layer | 0].p[m.id] = m.value;
        break;
      case 'global':
        this.globals[m.id] = m.value;
        break;
      case 'pools':
        this.pools = m.pools;
        break;
      case 'noteOn':
        this.noteOn(m.note, m.velocity, m.layer | 0);
        break;
      case 'noteOff':
        this.noteOff(m.note, m.layer | 0);
        break;
      case 'pressure':
        this.globals.pressure = m.value;
        break;
      case 'allNotesOff':
        for (const v of this.voices) v.noteOff();
        break;
      case 'panic':
        for (const v of this.voices) v.kill();
        break;
      case 'autoTune':
        // "the microprocessor automatically tunes all OB-X oscillators"
        this.tuneDrift = 0;
        for (const v of this.voices) { v.driftPhaseA = Math.random() * TWO_PI; v.reroll(); }
        break;
    }
  }

  // --- voice allocation ----------------------------------------------------

  poolFor(layer) {
    const pool = this.pools[layer];
    if (pool && pool.length) return pool;
    // Fall back to the first pool, then to every voice, so a malformed pools
    // message can never leave note-on with nothing to allocate from.
    const first = this.pools[0];
    return first && first.length ? first : ALL_VOICES;
  }

  noteOn(note, velocity, layer) {
    const L = this.layers[layer];
    const pool = this.poolFor(layer);

    if (L.get('unison') >= 0.5) {
      // "causes all voices to be sounded by one key depression" with low
      // note priority.
      const sounding = pool.map((i) => this.voices[i]).filter((v) => v.gate && v.note >= 0);
      if (sounding.length && note > Math.min(...sounding.map((v) => v.note))) return;
      const glide = scale.glide(L.get('portamento')) > 0 && sounding.length ? sounding[0].pitch : null;
      for (const i of pool) {
        const v = this.voices[i];
        v.layer = layer;
        v.noteOn(note, velocity, glide);
      }
      return;
    }

    // Re-use a voice already holding this note, then a free one, then steal
    // the oldest.
    let chosen = pool.find((i) => this.voices[i].note === note && this.voices[i].gate);
    if (chosen === undefined) chosen = pool.find((i) => !this.voices[i].active);
    if (chosen === undefined) chosen = pool.find((i) => !this.voices[i].gate);
    if (chosen === undefined) {
      let oldest = pool[0];
      for (const i of pool) if (this.voices[i].age > this.voices[oldest].age) oldest = i;
      chosen = oldest;
    }
    const v = this.voices[chosen];
    const glideOn = scale.glide(L.get('portamento')) > 0;
    v.layer = layer;
    v.age = 0;
    v.noteOn(note, velocity, glideOn && v.note >= 0 ? v.pitch : null);
  }

  noteOff(note, layer) {
    const L = this.layers[layer];
    const pool = this.poolFor(layer);
    if (L.get('unison') >= 0.5) {
      const anyOther = pool.some((i) => this.voices[i].gate && this.voices[i].note !== note);
      if (!anyOther) for (const i of pool) this.voices[i].noteOff();
      return;
    }
    for (const i of pool) {
      const v = this.voices[i];
      if (v.note === note && v.gate) v.noteOff();
    }
  }

  // --- audio ---------------------------------------------------------------

  process(_inputs, outputs) {
    const out = outputs[0];
    const outL = out[0];
    const outR = out.length > 1 ? out[1] : out[0];
    const n = outL.length;
    outL.fill(0);
    if (outR !== outL) outR.fill(0);

    // Slow global oscillator drift, the "vintage" wander shared by the
    // whole instrument on top of each voice's own scatter.
    this.driftClock += n / SR;
    this.tuneDrift = Math.sin(this.driftClock * 0.11) * 0.5 + Math.sin(this.driftClock * 0.037) * 0.5;

    const g = this.globals;
    const lfoBufs = [this.layers[0].renderLFO(n, 1), this.layers[1].renderLFO(n, 1)];

    // MASTER TUNE has a dead zone at the centre; outside it, ±50 cents.
    const mt = g.masterTune - 0.5;
    const masterCents = Math.abs(mt) < 0.04 ? 0 : (mt - Math.sign(mt) * 0.04) * 108.7;

    const bendSemis = (g.bendRange >= 0.5 ? 12 : 2) * g.bend;
    const spread = g.volBalance;

    for (const voice of this.voices) {
      if (!voice.active) { voice.age += n; continue; }
      voice.age += n;
      this.renderVoice(voice, this.layers[voice.layer], lfoBufs[voice.layer], n,
                       outL, outR, masterCents, bendSemis, spread);
    }

    // Master volume, smoothed. Not programmable — the manual is explicit that
    // VOLUME "cannot be input into the programmer".
    const targetGain = g.masterVol * g.masterVol * 0.9;
    for (let i = 0; i < n; i++) {
      this.masterGain += (targetGain - this.masterGain) * 0.002;
      outL[i] = softClip(outL[i] * this.masterGain);
      if (outR !== outL) outR[i] = softClip(outR[i] * this.masterGain);
    }
    return true;
  }

  renderVoice(v, L, lfo, n, outL, outR, masterCents, bendSemis, spread) {
    const gl = this.globals;

    // ---- per-block coefficients -------------------------------------------
    const vintage = L.get('vintage');
    const detuneCents = (L.get('osc2detune', 0.5) - 0.5) * 100;

    const osc1Base = scale.osc1Semis(L.get('osc1Freq'));
    const osc2Base = scale.osc2Semis(L.get('osc2Freq'));

    const saw1 = L.get('osc1Saw') >= 0.5, pul1 = L.get('osc1Pulse') >= 0.5;
    const saw2 = L.get('osc2Saw') >= 0.5, pul2 = L.get('osc2Pulse') >= 0.5;
    const tri1 = saw1 && pul1, tri2 = saw2 && pul2;
    const osc1On = saw1 || pul1, osc2On = saw2 || pul2;

    const pwBase = scale.pulseWidth(L.get('pulseWidth'));
    // Off / half / full, matching the depth the old continuous control gave
    // at its useful settings.
    const xmod = [0, 0.5, 2.0][Math.round(L.get('xmod'))] ?? 0;
    const syncOn = L.get('sync') >= 0.5;

    const depth1 = L.get('depth1');
    const d1o1 = L.get('d1Osc1') >= 0.5, d1o2 = L.get('d1Osc2') >= 0.5, d1f = L.get('d1Filter') >= 0.5;
    const depth2 = L.get('depth2');
    const d2p1 = L.get('d2Pwm1') >= 0.5, d2p2 = L.get('d2Pwm2') >= 0.5, d2v = L.get('d2Volume') >= 0.5;

    const fOsc1 = L.get('fOsc1') >= 0.5 ? 1 : 0;
    const fOsc2Sel = Math.round(L.get('fOsc2', 2));
    const fOsc2 = fOsc2Sel === 0 ? 0 : fOsc2Sel === 1 ? 0.56 : 1;  // half ≈ −5 dB
    const fNoiseSel = Math.round(L.get('fNoise', 0));
    const fNoise = fNoiseSel === 0 ? 0 : fNoiseSel === 1 ? 0.56 : 1;

    const fourPole = Math.round(L.get('filterType')) === 1;
    const res = L.get('resonance');
    // Damping runs from 2.0 (Q = 0.5, no emphasis) down to 0.1 (Q = 10), which
    // is a strong peak that still cannot break into oscillation.
    const k = 2 - 1.9 * res;
    const kbd = L.get('kbdTrack') >= 0.5 ? 1 : 0;
    const cutoffBase = L.get('cutoff');
    const filterMod = L.get('filterMod');

    const veloSel = Math.round(L.get('velo'));
    const veloFil = (veloSel & 1) === 1, veloAmp = (veloSel & 2) === 2;
    const touchSel = Math.round(L.get('touch'));
    const touchFil = (touchSel & 1) === 1, touchAmp = (touchSel & 2) === 2;

    const tt = v.timeTrim * (1 + vintage * 0.0);
    const coef = (t) => 1 - Math.exp(-1 / Math.max(1, scale.time(t) * tt * SR));
    const fca = coef(L.get('fAttack')), fcd = coef(L.get('fDecay')), fcr = coef(L.get('fRelease'));
    const fs = L.get('fSustain');
    const aca = coef(L.get('aAttack')), acd = coef(L.get('aDecay')), acr = coef(L.get('aRelease'));
    const as = L.get('aSustain');

    const glideTime = scale.glide(L.get('portamento'));
    const glideCoef = glideTime > 0 ? 1 - Math.exp(-1 / (glideTime * SR)) : 1;

    // Per-voice analogue scatter.
    const voiceDetune = vintage * (v.driftA * 9 + this.tuneDrift * v.driftB * 4);
    const voiceCut = vintage * v.cutoffTrim * 0.06;

    // Pan pots: the original spreads its voices across the stereo field.
    const panPos = ((v.index / (VOICE_COUNT - 1)) * 2 - 1) * spread;
    const gainL = Math.cos((panPos + 1) * Math.PI / 4);
    const gainR = Math.sin((panPos + 1) * Math.PI / 4);

    const velAmp = veloAmp ? 0.25 + 0.75 * v.velocity : 1;
    const velFilAmt = veloFil ? v.velocity : 1;

    for (let i = 0; i < n; i++) {
      const mod = lfo[i];

      // ---- pitch --------------------------------------------------------
      v.pitch += (v.target - v.pitch) * glideCoef;

      const pressure = gl.pressure;
      // "This controls the amount of vibrato to be added to both Oscillators."
      const vib = gl.modDepth * 0.5 * mod;
      const freqMod = depth1 * depth1 * 12 * mod;

      let semis1 = v.pitch + gl.transpose * 12 + osc1Base + masterCents / 100 + voiceDetune / 100 + vib;
      let semis2 = v.pitch + gl.transpose * 12 + osc2Base + masterCents / 100
                 + (voiceDetune + detuneCents) / 100 + vib;
      if (d1o1) semis1 += freqMod;
      if (d1o2) semis2 += freqMod;
      if (gl.bendOsc2Only >= 0.5) semis2 += bendSemis;
      else { semis1 += bendSemis; semis2 += bendSemis; }

      const f1 = 440 * semisToRatio(semis1 - 69);
      const f2 = 440 * semisToRatio(semis2 - 69);

      // ---- pulse width ---------------------------------------------------
      const pwMod = depth2 * 0.42 * mod;
      const pw1 = clamp(pwBase + (d2p1 ? pwMod : 0), 0.03, 0.97);
      const pw2 = clamp(pwBase + (d2p2 ? pwMod : 0), 0.03, 0.97);

      // ---- oscillators, 2x oversampled -----------------------------------
      for (let s = 0; s < 2; s++) {
        // Both increments are capped short of Nyquist. Without the cap a high
        // key with osc 2 tuned up five octaves and TRANSPOSE UP (or a broad
        // bend) pushes the increment past a whole cycle per sample, and the
        // single-subtract wrap below can never bring the phase back into
        // range — the oscillator folds down to a loud audible tone where it
        // should be inaudibly high.
        const dt2 = clamp(f2 / (SR * 2), 0, 0.45);
        // Oscillator 2 first: it can modulate oscillator 1 (X-MOD) and is the
        // slave when SYNC is on.
        v.phase2 += dt2;
        if (v.phase2 >= 1) v.phase2 -= 1;

        let o2 = 0;
        if (osc2On) {
          if (tri2) {
            const sq = (v.phase2 < pw2 ? 1 : -1)
                     + polyBlep(v.phase2, dt2)
                     - polyBlep((v.phase2 + 1 - pw2) % 1, dt2);
            v.tri2 = (v.tri2 + 4 * dt2 * sq) * 0.9995;
            o2 = v.tri2;
          } else if (saw2) {
            o2 = 2 * v.phase2 - 1 - polyBlep(v.phase2, dt2);
          } else {
            o2 = (v.phase2 < pw2 ? 1 : -1)
               + polyBlep(v.phase2, dt2)
               - polyBlep((v.phase2 + 1 - pw2) % 1, dt2);
          }
        }

        // "X-MOD ... causes Oscillator 2 to modulate Oscillator 1"
        const f1m = xmod > 0 ? f1 * (1 + xmod * o2) : f1;
        const dt1 = clamp(Math.abs(f1m) / (SR * 2), 0, 0.45);

        v.phase1 += dt1;
        if (v.phase1 >= 1) {
          v.phase1 -= 1;
          // "SYNC ... causes Oscillator 2 to lock onto a harmonic of
          //  Oscillator 1" — the master's wrap resets the slave.
          // The slave restarts proportionally to how far the master overshot
          // its wrap, which places the reset at the right sub-sample instant.
          // The modulo keeps a very slow master from throwing the ratio out of
          // range.
          if (syncOn) {
            v.phase2 = (v.phase1 * (dt2 / Math.max(dt1, 1e-9))) % 1;
            v.tri2 = 0;
          }
        }

        let o1 = 0;
        if (osc1On) {
          if (tri1) {
            const sq = (v.phase1 < pw1 ? 1 : -1)
                     + polyBlep(v.phase1, dt1)
                     - polyBlep((v.phase1 + 1 - pw1) % 1, dt1);
            v.tri1 = (v.tri1 + 4 * dt1 * sq) * 0.9995;
            o1 = v.tri1;
          } else if (saw1) {
            o1 = 2 * v.phase1 - 1 - polyBlep(v.phase1, dt1);
          } else {
            o1 = (v.phase1 < pw1 ? 1 : -1)
               + polyBlep(v.phase1, dt1)
               - polyBlep((v.phase1 + 1 - pw1) % 1, dt1);
          }
        }
        // The input saturation lives here, inside the oversampled section,
        // so the harmonics it generates are caught by the decimator instead
        // of folding back into the audible band. Measured, moving it out of
        // the filter and up here is worth about 5 dB of alias rejection.
        const raw = (o1 * fOsc1 + o2 * fOsc2) * 0.5;
        v.decim.push(fastTanh(raw * 0.9) * 1.11);
      }
      let mix = v.decim.read();
      if (fNoise > 0) mix += v.noise() * fNoise * 0.35;

      // ---- envelopes ------------------------------------------------------
      const fEnv = v.filterEnv.process(fca, fcd, fcr, fs);
      const aEnv = v.ampEnv.process(aca, acd, acr, as);

      // ---- filter ---------------------------------------------------------
      let cut = cutoffBase + voiceCut;
      cut += filterMod * fEnv * velFilAmt;
      if (d1f) cut += depth1 * mod * 0.5;
      if (kbd) cut += (v.pitch - 60) / 120;
      if (touchFil) cut += pressure * 0.4;
      cut = clamp(cut, 0, 1.25);

      const fc = clamp(scale.cutoff(cut), 12, SR * 0.45);
      const gTan = Math.tan(Math.PI * fc / SR);

      let sig = v.filter.process(mix, gTan, k, fourPole);
      sig *= 1 + res * 0.35;                          // a little make-up for the narrow peak
      // AC-couple before the amplifier, so a narrow pulse's offset cannot
      // turn the envelope into a thump.
      sig = v.dcBlock.process(sig);

      // ---- amplifier ------------------------------------------------------
      let amp = aEnv * velAmp;
      if (touchAmp) amp *= 1 + pressure * 0.6;
      if (d2v) amp *= 1 - depth2 * 0.5 * (0.5 - mod * 0.5);

      const y = sig * amp * 0.32;
      outL[i] += y * gainL;
      if (outR !== outL) outR[i] += y * gainR;
    }
  }
}

registerProcessor('obx-processor', OBXProcessor);

<script type="module">
/*
 * addModule() needs a URL. A Blob URL is the efficient choice and works
 * wherever the page has a real origin, but a page opened straight from disk
 * has an opaque origin, its Blob URLs come out as "blob:null/..." and the
 * worklet loader refuses them. A data: URL has no origin to check and loads
 * in both cases, so it is the fallback.
 */
function obxWorkletSource() {
  return document.getElementById('obx-worklet-source').textContent;
}
function obxBlobURL() {
  return URL.createObjectURL(new Blob([obxWorkletSource()], { type: 'text/javascript' }));
}
function obxDataURL() {
  const utf8 = new TextEncoder().encode(obxWorkletSource());
  let bin = '';
  for (const byte of utf8) bin += String.fromCharCode(byte);
  return 'data:text/javascript;base64,' + btoa(bin);
}
async function addWorklet(ctx) {
  try {
    await ctx.audioWorklet.addModule(obxBlobURL());
  } catch {
    await ctx.audioWorklet.addModule(obxDataURL());
  }
}

const PARAM_BY_ID = Object.fromEntries(PARAMS.map((p) => [p.id, p]));

/** A fresh program with every parameter at its default. */
function defaultProgram(name = 'Init Program') {
  const prog = { name };
  for (const p of PARAMS) prog[p.id] = p.def;
  return prog;
}

/** Clone + fill in anything missing, so partial preset definitions are legal. */
function normaliseProgram(src, fallbackName = 'Program') {
  const prog = defaultProgram(src?.name ?? fallbackName);
  if (src) {
    for (const p of PARAMS) {
      if (typeof src[p.id] === 'number') prog[p.id] = clampParam(p, src[p.id]);
    }
  }
  return prog;
}

function clampParam(p, v) {
  if (!Number.isFinite(v)) return p.def;
  if (p.type === 'switch') return v >= 0.5 ? 1 : 0;
  if (p.type === 'multi') return Math.min(p.states - 1, Math.max(0, Math.round(v)));
  return Math.min(1, Math.max(0, v));
}

/** Quantise a knob to its detents, if it has any (osc frequency switches). */
function quantise(p, v) {
  if (p.type !== 'knob' || !p.steps) return v;
  const n = p.steps - 1;
  return Math.round(v * n) / n;
}

/** Panel address ("A1".."D8") for a bank index. */
function programAddress(index) {
  const i = ((index % 32) + 32) % 32;
  return `${'ABCD'[Math.floor(i / 8)]}${(i % 8) + 1}`;
}

/** Bank index for a panel address, e.g. ('C', 5) -> 20. */
function programIndex(group, program) {
  const g = typeof group === 'number' ? group : 'ABCD'.indexOf(String(group).toUpperCase());
  return Math.max(0, g) * 8 + (Math.min(8, Math.max(1, program)) - 1);
}


// ===== src/ui.js ===================================================
/*
 * OB-X replica — control surface widgets and panel construction.
 *
 * The layout mirrors the front panel: MASTER, CONTROL, MODULATION,
 * OSCILLATORS, FILTER, ENVELOPES on the upper row; KEYBOARD and PROGRAMMER
 * on the lower row; the performance panel sits to the left of the keybed.
 *
 * Controls address the store by id. Programmable parameters use their bare
 * parameter id; non-programmable ones (the manual's MANUAL section, the
 * performance panel, keyboard modes) use a "g:" prefix.
 */


const KNOB_SWEEP = 300; // degrees of travel, -150..+150

// ---------------------------------------------------------------------------
// Small DOM helper
// ---------------------------------------------------------------------------
function el(tag, cls, attrs) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined) continue;
    if (k === 'text') n.textContent = v;
    else n.setAttribute(k, v);
  }
  return n;
}

function add(parent, ...kids) {
  for (const k of kids) if (k) parent.appendChild(k);
  return parent;
}

// ---------------------------------------------------------------------------
// Knob
// ---------------------------------------------------------------------------

class Knob {
  constructor(ui, { id, label, size = 'md', led = false, format }) {
    this.ui = ui;
    this.id = id;
    this.format = format;

    this.root = el('div', `ctl knob-ctl size-${size}`, { 'data-param': id });
    if (led) {
      this.led = el('i', 'led led-red knob-led');
      add(this.root, this.led);
    }
    if (label) add(this.root, el('div', 'cap', { text: label }));

    this.knob = el('div', 'knob', {
      role: 'slider', tabindex: '0',
      'aria-label': label || id,
      'aria-valuemin': '0', 'aria-valuemax': '100',
    });
    this.ticks = el('div', 'knob-ticks');
    for (let i = 0; i < 11; i++) {
      const t = el('i', 'tick');
      t.style.transform = `rotate(${-150 + i * 30}deg) translateY(-50%)`;
      add(this.ticks, t);
    }
    this.body = el('div', 'knob-body');
    this.pointer = el('div', 'knob-pointer');
    add(this.body, this.pointer);
    add(this.knob, this.ticks, this.body);
    add(this.root, this.knob);

    this.attach();
  }

  attach() {
    const knob = this.knob;
    let dragging = false, startY = 0, startX = 0, startVal = 0, moved = false;

    const onMove = (ev) => {
      if (!dragging) return;
      ev.preventDefault();
      const p = ev.touches ? ev.touches[0] : ev;
      const dy = startY - p.clientY;
      const dx = p.clientX - startX;
      const fine = ev.shiftKey ? 0.25 : 1;
      const delta = ((dy + dx) / 180) * fine;
      if (Math.abs(dy) + Math.abs(dx) > 2) moved = true;
      this.ui.setValue(this.id, clamp01(startVal + delta));
    };
    const onUp = () => {
      dragging = false;
      document.body.classList.remove('dragging');
      this.ui.hideTip();
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    };
    knob.addEventListener('pointerdown', (ev) => {
      ev.preventDefault();
      knob.focus();
      dragging = true; moved = false;
      startY = ev.clientY; startX = ev.clientX;
      startVal = this.ui.getValue(this.id);
      document.body.classList.add('dragging');
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    });
    knob.addEventListener('dblclick', () => {
      const p = PARAM_BY_ID[this.id];
      this.ui.setValue(this.id, p ? p.def : 0.5);
    });
    knob.addEventListener('wheel', (ev) => {
      ev.preventDefault();
      const step = ev.shiftKey ? 0.005 : 0.02;
      this.ui.setValue(this.id, clamp01(this.ui.getValue(this.id) - Math.sign(ev.deltaY) * step));
    }, { passive: false });
    knob.addEventListener('keydown', (ev) => {
      const step = ev.shiftKey ? 0.005 : 0.02;
      let d = 0;
      if (ev.key === 'ArrowUp' || ev.key === 'ArrowRight') d = step;
      else if (ev.key === 'ArrowDown' || ev.key === 'ArrowLeft') d = -step;
      else if (ev.key === 'Home') return this.ui.setValue(this.id, 0);
      else if (ev.key === 'End') return this.ui.setValue(this.id, 1);
      else return;
      ev.preventDefault();
      this.ui.setValue(this.id, clamp01(this.ui.getValue(this.id) + d));
    });
    knob.addEventListener('pointerenter', () => this.ui.showTip(this));
    knob.addEventListener('pointerleave', () => { if (!dragging) this.ui.hideTip(); });
  }

  render(v) {
    const p = PARAM_BY_ID[this.id];
    const shown = p ? quantise(p, v) : v;
    this.pointer.style.transform = `rotate(${-KNOB_SWEEP / 2 + shown * KNOB_SWEEP}deg)`;
    this.knob.setAttribute('aria-valuenow', Math.round(shown * 100));
    this.knob.setAttribute('aria-valuetext', this.text(shown));
    if (this.led) this.led.classList.toggle('on', Math.abs(shown - 0.5) > 0.02);
  }

  text(v) {
    return this.format ? this.format(v) : `${Math.round(v * 100)}`;
  }
}

function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }

// ---------------------------------------------------------------------------
// Rocker switch (on/off or multi-state, with one or two LEDs)
// ---------------------------------------------------------------------------

class Rocker {
  constructor(ui, { id, label, leds = ['red'], ledCaps, states = 2, wide = false, momentary = false }) {
    this.ui = ui;
    this.id = id;
    this.states = states;
    this.momentary = momentary;

    this.root = el('div', `ctl sw-ctl${wide ? ' wide' : ''}`, { 'data-param': id });
    if (ledCaps) {
      const caps = el('div', 'led-caps');
      for (const c of ledCaps) add(caps, el('span', 'led-cap', { text: c }));
      add(this.root, caps);
    }
    this.btn = el('button', 'rocker', { type: 'button', 'aria-label': label || id });
    add(this.btn, el('span', 'sw-label', { text: label || '' }));
    this.leds = leds.map((colour) => el('i', `led led-${colour}`));
    const ledBox = el('span', `leds n${this.leds.length}`);
    add(ledBox, ...this.leds);
    add(this.btn, ledBox, el('span', 'rocker-face'));
    add(this.root, this.btn);

    if (momentary) {
      this.btn.addEventListener('pointerdown', () => this.ui.momentary(this.id, true));
      const up = () => this.ui.momentary(this.id, false);
      this.btn.addEventListener('pointerup', up);
      this.btn.addEventListener('pointerleave', up);
    } else {
      this.btn.addEventListener('click', () => this.ui.toggle(this.id, this.states));
    }
  }

  render(v) {
    const n = Math.round(v);
    this.btn.setAttribute('aria-pressed', n > 0 ? 'true' : 'false');
    this.root.classList.toggle('on', n > 0);
    if (this.leds.length === 1) {
      this.leds[0].classList.toggle('on', n > 0);
    } else if (this.states === 2) {
      // A two-position selector lights one LED or the other — the filter's
      // 2 / 4 pole choice and the lever's Mod / Arp mode.
      this.leds[0].classList.toggle('on', n === 0);
      this.leds[1].classList.toggle('on', n === 1);
    } else {
      // Otherwise the pair reads as a small binary display, matching the
      // panel's FIL / AMP and HALF / FULL indicators.
      this.leds[0].classList.toggle('on', n === 1 || n === 3);
      this.leds[1].classList.toggle('on', n === 2 || n === 3);
    }
  }
}

// ---------------------------------------------------------------------------
// Panel construction
// ---------------------------------------------------------------------------

class Surface {
  constructor(store) {
    this.store = store;
    this.controls = new Map(); // id -> widget[]
    this.tooltip = document.getElementById('tooltip');
  }

  // --- store plumbing ------------------------------------------------------
  getValue(id) { return this.store.get(id); }
  setValue(id, v) {
    this.store.set(id, v);
    const w = this.controls.get(id);
    if (w) for (const c of w) if (c.showTipNow !== false) this.showTip(c);
  }
  toggle(id, states) {
    const cur = Math.round(this.store.get(id) || 0);
    this.store.set(id, (cur + 1) % states);
  }
  momentary(id, down) { this.store.set(id, down ? 1 : 0); }

  register(widget) {
    if (!this.controls.has(widget.id)) this.controls.set(widget.id, []);
    this.controls.get(widget.id).push(widget);
    return widget.root;
  }

  refresh() {
    for (const id of this.controls.keys()) this.renderOne(id);
  }

  renderOne(id) {
    const widgets = this.controls.get(id);
    if (!widgets) return;
    const v = this.store.get(id);
    for (const w of widgets) w.render(typeof v === 'number' ? v : 0);
  }

  showTip(widget) {
    if (!this.tooltip || !widget.text) return;
    const r = widget.root.getBoundingClientRect();
    this.tooltip.textContent = widget.text(this.store.get(widget.id));
    this.tooltip.hidden = false;
    this.tooltip.style.left = `${r.left + r.width / 2}px`;
    this.tooltip.style.top = `${r.top - 6}px`;
  }
  hideTip() { if (this.tooltip) this.tooltip.hidden = true; }

  // --- widget factories ----------------------------------------------------
  knob(opts) { const k = new Knob(this, opts); return this.register(k); }
  sw(opts) { const s = new Rocker(this, opts); return this.register(s); }

  // -------------------------------------------------------------------------
  build(root, perfRoot, keybedRoot) {
    add(root, this.masterPanel(), this.controlPanel(), this.modulationPanel(),
              this.oscillatorPanel(), this.filterPanel(), this.envelopePanel(),
              this.keyboardPanel(), this.programmerPanel());
    add(perfRoot, ...this.perfPanel());
    this.buildKeybed(keybedRoot);
    this.refresh();
  }

  panel(key, title, cls = '') {
    const p = el('section', `panel panel-${key} ${cls}`.trim(), { 'data-panel': key });
    p.appendChild(el('div', 'panel-inner'));
    if (title) p.appendChild(el('div', 'panel-name', { text: title }));
    return p;
  }

  row(cls, ...kids) { return add(el('div', `row ${cls}`.trim()), ...kids); }
  col(cls, ...kids) { return add(el('div', `col ${cls}`.trim()), ...kids); }

  // --- MASTER (not programmable) ------------------------------------------
  masterPanel() {
    const p = this.panel('master', 'MASTER');
    add(p.firstChild,
      this.row('knobs',
        this.knob({ id: 'g:masterVol', label: 'MASTER VOL', format: pct }),
        this.knob({ id: 'g:volBalance', label: 'VOL/BALANCE', format: pct })),
      this.row('switches',
        this.sw({ id: 'g:tune', label: 'TUNE', momentary: true }),
        this.sw({ id: 'g:hold', label: 'HOLD' }),
        this.sw({ id: 'g:chord', label: 'CHORD' })),
      this.row('knobs single',
        this.knob({ id: 'g:masterTune', label: 'MASTER TUNE', format: cents })));
    return p;
  }

  // --- CONTROL -------------------------------------------------------------
  controlPanel() {
    const p = this.panel('control', 'CONTROL');
    add(p.firstChild,
      this.row('knobs',

      add(el('div', 'perf-group transpose'),

              labelled('DOWN', this.sw({ id: 'g:transposeDown', label: '' })),
